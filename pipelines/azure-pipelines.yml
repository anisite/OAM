# OIM — build et déploiement IIS, sur le modèle des releases classiques de GED
# (Release.GED.Complet.Satellite.master et Release.GED.Complet.release) :
#
#   toute branche → Build
#   main       → Build → SAT
#   release/*  → Build → ACCP → IT (bascule A/B) → PROD (bascule A/B) → ACCP ligne PROD
#   PR         → Build seulement
#
# Prérequis Azure DevOps (une fois) :
#   - Environnements SAT, ACCP, IT, PROD : ressources « machine virtuelle » (agents installés par la trousse,
#     configurés avec --environment) étiquetées « OIM », plus « 1 » ou « 2 » pour les nœuds A et B d'IT et PROD.
#   - Approbations (« Release Administrators ») sur les environnements ACCP, IT et PROD : elles remplacent
#     les approbations de prédéploiement des releases classiques.
#   - Groupes de variables (bibliothèque) : OIM.Parametres.General et OIM.Parametres.<palier>
#     (sat, ac, it, PROD, ac.ligne.prod). Voir deployer-oim.yml et la section plus bas.
#   - Site drain.local sur les serveurs d'IT et de PROD (sonde de l'équilibreur), comme pour GED.
#
# Les étapes de déploiement sont des gabarits réutilisables, équivalents YAML des groupes de tâches de GED :
# pipelines/Deployer/Deployer.*.yml (à déplacer plus tard dans un dépôt partagé entre applications).
# Azure DevOps Server : artefacts de build (PublishBuildArtifacts / DownloadBuildArtifacts), pas de « pipeline artifacts ».

name: $(SourceBranchName)_$(Date:yyyyMMdd)$(Rev:.r)

trigger:
  batch: true
  branches:
    include:
      - '*'         # toutes les branches; les déploiements dépendent de la branche (voir les étapes)

pr:
  branches:
    include:
      - main

pool:
  name: 'Default'

variables:
  solution: 'OIM.slnx'
  buildConfiguration: 'Release'
  dotnetVersion: '10.x'
  nodeVersion: '22.x'

stages:
  - stage: Build
    displayName: 'Build'
    jobs:
      - job: BuildAndTest
        displayName: 'Build, tests, publication'
        steps:
          - task: UseDotNet@2
            displayName: 'Installer .NET SDK'
            inputs:
              packageType: 'sdk'
              version: '$(dotnetVersion)'

          - task: NodeTool@0
            displayName: 'Installer Node.js'
            inputs:
              versionSpec: '$(nodeVersion)'

          - task: DotNetCoreCLI@2
            displayName: 'dotnet restore'
            inputs:
              command: 'restore'
              projects: '$(solution)'

          - task: DotNetCoreCLI@2
            displayName: 'dotnet build'
            inputs:
              command: 'build'
              projects: '$(solution)'
              arguments: '--configuration $(buildConfiguration) --no-restore'

          # Unitaires + intégration + tests métier (definitions/<equipe>/<processus>/tests/*.yml).
          # Les tests d'intégration exigent LocalDB « OIM » sur l'agent, sinon ils sont « non concluants ».
          - task: DotNetCoreCLI@2
            displayName: 'dotnet test'
            inputs:
              command: 'test'
              projects: 'tests/**/*.csproj'
              arguments: '--configuration $(buildConfiguration) --no-build'
              publishTestResults: true

          # Interface Vue (vérification de types + build) → sources/OIM.Api/wwwroot : servie par le même site IIS.
          - script: |
              cd sources/OIM.Frontend
              npm ci
              npm run build
            displayName: 'Build de l’interface'

          - task: DotNetCoreCLI@2
            displayName: 'Publish OIM.Api'
            inputs:
              command: 'publish'
              publishWebProjects: false
              projects: 'sources/OIM.Api/OIM.Api.csproj'
              arguments: '--configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)'
              zipAfterPublish: true

          - task: CopyFiles@2
            displayName: 'Copier les scripts de déploiement'
            inputs:
              SourceFolder: 'pipelines/scripts'
              TargetFolder: '$(Build.ArtifactStagingDirectory)'

          # Azure DevOps Server : artefacts de build (les « pipeline artifacts » n'existent qu'en Services).
          - task: PublishBuildArtifacts@1
            displayName: 'Publier l’artefact drop'
            inputs:
              PathtoPublish: '$(Build.ArtifactStagingDirectory)'
              ArtifactName: 'drop'

  # ── Configuration par palier ────────────────────────────────────────────────
  # OIM.Parametres.General : OIM.CheminPhysique (C:\inetpub\wwwroot\OIM), OIM.MaxProcess (1)
  # OIM.Parametres.<palier> :
  #   OIM.Palier (sa, ac, it, pr), OIM.Feature (master, release, prod), OIM.DNS, OIM.CertificatIntra,
  #   OIM.AppPoolUser, OIM.AppPoolPass (secret)
  #   Clés substituées dans appsettings.json :
  #     ConnectionStrings.Oim                   chaîne de connexion
  #     Oim.Securite.Fournisseurs.oim.Cle       clé de signature des jetons (secrète, identique sur les nœuds A et B)
  #     Oim.Securite.Administrateurs.0          groupe AD des administrateurs OIM
  #     Oim.Securite.Support.0                  groupe AD du support OIM
  #     Oim.Courriel.Hote, Oim.Courriel.De      SMTP

  - stage: SAT
    displayName: 'SAT'
    dependsOn: Build
    condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    variables:
      - group: OIM.Parametres.General
      - group: OIM.Parametres.sat
    jobs:
      - template: palier-un-noeud.yml
        parameters:
          environnement: 'SAT'

  - stage: ACCP
    displayName: 'ACCP'
    dependsOn: Build
    condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'), startsWith(variables['Build.SourceBranch'], 'refs/heads/release/'))
    variables:
      - group: OIM.Parametres.General
      - group: OIM.Parametres.ac
    jobs:
      - template: palier-un-noeud.yml
        parameters:
          environnement: 'ACCP'

  - stage: IT
    displayName: 'IT'
    dependsOn: ACCP
    condition: succeeded()
    variables:
      - group: OIM.Parametres.General
      - group: OIM.Parametres.it
    jobs:
      - template: palier-deux-noeuds.yml
        parameters:
          environnement: 'IT'

  - stage: PROD
    displayName: 'PROD'
    dependsOn: IT
    condition: succeeded()
    variables:
      - group: OIM.Parametres.General
      - group: OIM.Parametres.PROD
    jobs:
      - template: palier-deux-noeuds.yml
        parameters:
          environnement: 'PROD'

  # Comme GED : l'ACCP reçoit ensuite la version de production dans un site « prod » distinct.
  - stage: ACCP_LignePROD
    displayName: 'ACCP ligne PROD'
    dependsOn: PROD
    condition: succeeded()
    variables:
      - group: OIM.Parametres.General
      - group: OIM.Parametres.ac.ligne.prod
    jobs:
      - template: palier-un-noeud.yml
        parameters:
          environnement: 'ACCP'
