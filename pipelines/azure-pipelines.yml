trigger:
  branches:
    include:
      - main
      - master
      - develop
      - release/*

pool:
  name: 'Default'

variables:
  solution: 'OIM.slnx'
  buildConfiguration: 'Release'
  dotnetVersion: '10.x'
  nodeVersion: '22.x'

stages:
  - stage: Build
    displayName: 'Build & Test'
    jobs:
      - job: BuildAndTest
        displayName: 'Build, Test, Publish'
        steps:
          - task: UseDotNet@2
            displayName: 'Installer .NET SDK'
            inputs:
              packageType: 'sdk'
              version: '$(dotnetVersion)'

          - task: NodeTool@0
            displayName: 'Installer Node.js'
            inputs:
              versionSpec: '$(nodeVersion)'

          # Restauration NuGet
          - task: DotNetCoreCLI@2
            displayName: 'dotnet restore'
            inputs:
              command: 'restore'
              projects: '$(solution)'

          # Build backend
          - task: DotNetCoreCLI@2
            displayName: 'dotnet build'
            inputs:
              command: 'build'
              projects: '$(solution)'
              arguments: '--configuration $(buildConfiguration) --no-restore'

          # Tests
          - task: DotNetCoreCLI@2
            displayName: 'dotnet test'
            inputs:
              command: 'test'
              projects: 'tests/**/*.csproj'
              arguments: '--configuration $(buildConfiguration) --no-build --logger trx --results-directory $(Agent.TempDirectory)/TestResults'

          - task: PublishTestResults@2
            displayName: 'Publier résultats de tests'
            condition: always()
            inputs:
              testResultsFormat: 'VSTest'
              testResultsFiles: '$(Agent.TempDirectory)/TestResults/*.trx'

          # Build frontend Vue.js
          - script: |
              cd sources/OIM.Frontend
              npm ci
              npm run build
            displayName: 'Build Frontend Vue.js'

          # Publish API (inclut wwwroot avec le frontend buildé)
          - task: DotNetCoreCLI@2
            displayName: 'dotnet publish API'
            inputs:
              command: 'publish'
              projects: 'sources/OIM.Api/OIM.Api.csproj'
              arguments: '--configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)/api'

          - task: PublishBuildArtifacts@1
            displayName: 'Publier artefacts'
            inputs:
              PathtoPublish: '$(Build.ArtifactStagingDirectory)/api'
              ArtifactName: 'oim-api'

  # Déploiement SAT
  - stage: Deploy_SAT
    displayName: 'Déploiement SAT'
    dependsOn: Build
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/develop'))
    jobs:
      - deployment: DeploySAT
        displayName: 'Déployer sur SAT'
        environment:
          name: 'SAT'
          resourceType: VirtualMachine
          tags: Intranet
        strategy:
          runOnce:
            deploy:
              steps:
                - task: IISWebAppDeploymentOnMachineGroup@0
                  displayName: 'Déployer sur IIS SAT'
                  inputs:
                    WebSiteName: 'OIM-SAT'
                    Package: '$(Pipeline.Workspace)/oim-api/**/*.zip'

  # Déploiement ACCP
  - stage: Deploy_ACCP
    displayName: 'Déploiement ACCP'
    dependsOn: Deploy_SAT
    condition: succeeded()
    jobs:
      - deployment: DeployACCP
        displayName: 'Déployer sur ACCP'
        environment:
          name: 'ACCP'
          resourceType: VirtualMachine
          tags: Intranet
        strategy:
          runOnce:
            deploy:
              steps:
                - task: IISWebAppDeploymentOnMachineGroup@0
                  displayName: 'Déployer sur IIS ACCP'
                  inputs:
                    WebSiteName: 'OIM-ACCP'
                    Package: '$(Pipeline.Workspace)/oim-api/**/*.zip'

  # Déploiement IT
  - stage: Deploy_IT
    displayName: 'Déploiement IT'
    dependsOn: Deploy_ACCP
    condition: succeeded()
    jobs:
      - deployment: DeployIT
        displayName: 'Déployer sur IT'
        environment:
          name: 'IT'
          resourceType: VirtualMachine
          tags: Intranet
        strategy:
          runOnce:
            deploy:
              steps:
                - task: IISWebAppDeploymentOnMachineGroup@0
                  displayName: 'Déployer sur IIS IT'
                  inputs:
                    WebSiteName: 'OIM-IT'
                    Package: '$(Pipeline.Workspace)/oim-api/**/*.zip'

  # Déploiement PROD
  - stage: Deploy_PROD
    displayName: 'Déploiement PROD'
    dependsOn: Deploy_IT
    condition: and(succeeded(), startsWith(variables['Build.SourceBranch'], 'refs/heads/release/'))
    jobs:
      - deployment: DeployPROD
        displayName: 'Déployer sur PROD'
        environment:
          name: 'PROD'
          resourceType: VirtualMachine
          tags: Intranet
        strategy:
          runOnce:
            deploy:
              steps:
                - task: IISWebAppDeploymentOnMachineGroup@0
                  displayName: 'Déployer sur IIS PROD'
                  inputs:
                    WebSiteName: 'OIM-PROD'
                    Package: '$(Pipeline.Workspace)/oim-api/**/*.zip'
